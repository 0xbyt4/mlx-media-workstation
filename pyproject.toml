[project]
name = "mlx-media-workstation"
version = "0.1.0"
description = "A local app for open image, voice, music and video models on Apple Silicon (MLX)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "0xbyt4" }]
requires-python = ">=3.12"
keywords = ["mlx", "apple-silicon", "macos", "local-ai", "image-generation", "text-to-speech", "music-generation", "video-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
    # the app runs from a checkout and is not a package: this classifier makes PyPI refuse an upload
    "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://github.com/0xbyt4/mlx-media-workstation"
Issues = "https://github.com/0xbyt4/mlx-media-workstation/issues"
Security = "https://github.com/0xbyt4/mlx-media-workstation/security/policy"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
# a test that hangs prints every thread's stack after 60 s, so the cause shows in the log
faulthandler_timeout = 60
strict = true
