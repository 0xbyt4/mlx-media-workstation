[project]
name = "mlx-media-workstation"
version = "0.1.0"
description = "A local app for open image, voice, music and video models on Apple Silicon (MLX)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
# a test that hangs prints every thread's stack after 60 s, so the cause shows in the log
faulthandler_timeout = 60
strict = true
