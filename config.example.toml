# Copy this file to config.toml and change the paths to where you installed each model (README.md, "Install the
# models"). A key you leave out takes the value shown here. "~" means your home folder.

[paths]
# the mflux checkout's environment (MOSS-Image, FLUX.3 Klein)
mflux_bin = "~/mlx-media/mflux/.venv/bin"
# the LTX environment's bin folder (it holds ltx-2-mlx and python) and the LTX-2.5 weights
ltx_bin = "~/mlx-media/venv-ltx/bin"
ltx_model = "~/mlx-media/models/ltx-2.5-mlx-q8"
# the Fish Drama 3 environment's python and the weights
drama_python = "~/mlx-media/venv-drama/bin/python"
drama_model = "~/mlx-media/models/fish-audio-drama-3-4bit"
# the ACE-Step 1.5 checkout (with its .venv and checkpoints folders)
ace_dir = "~/mlx-media/ace-step"
# the local LLM's environment python and its weights (prompt help and chat)
qwen_python = "~/mlx-media/venv-qwen/bin/python"
qwen_model = "~/mlx-media/models/qwen3.8-27b-4bit"
# the Nemotron 3.5 Transcribe weights (a model of the Transcribe tool; it runs in the local LLM's environment)
nemotron_model = "~/mlx-media/models/nemotron-3.5-transcribe-nvfp4"
# the OvisOCR3 weights (Read Text); the tool runs in the local LLM's environment above
ocr_model = "~/mlx-media/models/ovisocr3"
# the DFlash2 draft model for faster answers ([app] llm_draft below); optional, about 3.85 GB
qwen_draft = "~/mlx-media/models/qwen3.8-27b-dflash2"

[assist]
# Prompt help ("Improve" under the prompt fields) and chat use the local LLM: provider = "local" (the only one built in)
provider = "local"

[app]
# Settings > Profile, Settings > Jobs and Settings > Local LLM. A change in the app applies at once; a change here by
# hand applies at the next start.
# keep the Mac from going to sleep while a job is queued or running (the display may still sleep): true or false
keep_awake = true
# a macOS notification when a job is done or failed: true or false
notify = true
# minutes without use before the local LLM is unloaded to free its memory; 0 = never
llm_idle_minutes = 10
# what the app shows: "full" (every section) or "chat" (Chat, Models and Settings only). start.py --chat always
# starts with "chat".
profile = "full"
# the thinking level of a new chat: "off", "low", "medium", "high", "xhigh" or "max" (docs/API.md, "Thinking levels")
chat_effort = "off"
# faster answers: the local LLM decodes with the DFlash2 draft model (qwen_draft). The model still samples every token;
# the draft adds about 3 GB of memory. true or false; it applies from the next request
llm_draft = false

[agent]
# Chat agent mode (docs/AGENT.md), also in Settings > Agent. Read at start: a change applies after a restart.
# the Python that run_python uses in the sandbox; "" = the app's own Python with the standard library only. For
# numpy, pandas or matplotlib, make a separate environment for the sandbox and give the absolute path of its python
# here, for example "~/mlx-media/venv-sandbox/bin/python" (docs/AGENT.md, "Settings", has the commands)
python = ""
# a SearXNG instance you run yourself (JSON format on), used first by web_search: the base URL, for example
# "http://127.0.0.1:8888"; "" = none
searxng_url = ""
# the Wikipedia that web_search asks: a language code such as en, de or tr
wikipedia_language = "en"
# also ask Marginalia Search with its shared key "public" (often rate limited): true or false
marginalia = true
